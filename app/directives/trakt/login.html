<small class="message {{ message.type }}" ng-repeat="message in messages track by $index">{{ message.content }}</small>

<div ng-switch="method">
  <div class="basic-authentication" ng-switch-default>
    <div class="fields">
      <label>Username
        <input type="text" ng-model="basic.username"/>
      </label>
      <label>Password
        <input type="password" ng-model="basic.password"/>
      </label>
    </div>
    <div class="buttons {{ buttonSize }}">
      <div class="buttons-left">
        <a class="button secondary {{ buttonSize }}"
           ng-class="{disabled: !isCancelEnabled}"
           ng-click="cancelLogin()"
           ng-show="cancelled"
        >
          Cancel
        </a>
        <a class="button secondary {{ buttonSize }}" dropdown-toggle="#trakt-mode-dropdown">Mode</a>
      </div>

      <co-button co-size="{{ buttonSize }}" co-callback="basicLogin">Sign in</co-button>
    </div>
  </div>

  <div class="pin-authentication" ng-switch-when="pin">
    <div class="fields">
      <p>Connect this Plex account using Trakt device authentication.</p>

      <div ng-show="device.userCode">
        <label for="trakt.oauth.device-code">Activation code</label>
        <input id="trakt.oauth.device-code"
               type="text"
               readonly
               ng-value="device.userCode"
               onclick="this.select()" />

        <p>
          <a ng-href="{{ device.activationUrl }}" target="_blank">
            Open Trakt activation page
          </a>
        </p>

        <small ng-show="device.pending">
          Waiting for authorization. You do not need to paste the code back here.
        </small>
      </div>
    </div>

    <div class="buttons {{ buttonSize }}">
      <div class="buttons-left">
        <a class="button secondary {{ buttonSize }}"
           ng-class="{disabled: !isCancelEnabled}"
           ng-click="cancelLogin()"
           ng-show="cancelled"
        >
          Cancel
        </a>
        <a class="button secondary {{ buttonSize }}" dropdown-toggle="#trakt-mode-dropdown">Mode</a>
      </div>

      <co-button co-size="{{ buttonSize }}" co-callback="deviceLogin">Connect Trakt</co-button>
    </div>
  </div>
</div>

<ul id="trakt-mode-dropdown" class="{{ buttonSize }} f-dropdown">
  <li ng-class="{active: method == 'manual'}">
    <a ng-click="switch('manual')">Basic</a>
  </li>
  <li ng-class="{active: method == 'pin'}">
    <a ng-click="switch('pin')">Device</a>
  </li>
</ul>
